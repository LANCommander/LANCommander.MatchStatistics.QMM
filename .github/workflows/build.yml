name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The plugins, Windows x86 and x64.
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        preset: [windows-x86, windows-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The presets take vcpkg from VCPKG_ROOT; the runner ships a clone. The
      # overlay triplets in triplets/ pin the v143 toolset the presets use.
      - name: Locate vcpkg
        shell: pwsh
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append'

      # The Interposer's CMake requires YY-Thunks to configure, even though the
      # plugin does not link it.
      - name: Fetch YY-Thunks
        shell: pwsh
        working-directory: external/LANCommander.Interposer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/Get-YYThunks.ps1

      - name: Build
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}-release

      - name: Test
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }}-release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: out/${{ matrix.preset }}/bin/Release/lancommander_qmm_*.dll

  # The plugins, Linux x86 and x64, in the Interposer's build image (Debian 12,
  # multilib), so they run on the glibc of LANCommander's server images.
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [linux-x86, linux-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build image
        run: docker build -f external/LANCommander.Interposer/docker/build.Dockerfile -t build external/LANCommander.Interposer/docker

      - name: Build and test
        run: |
          docker run --rm -v "$PWD:/src" -w /src build sh -c '
            cmake --preset ${{ matrix.preset }} &&
            cmake --build --preset ${{ matrix.preset }}-release &&
            ctest --preset ${{ matrix.preset }}-release'

      # Only QMM_* and the Interposer's API may be exported (src/plugin/exports.map).
      - name: Check exports
        run: |
          status=0
          for so in out/${{ matrix.preset }}/bin/Release/lancommander_qmm_*.so; do
            unexpected=$(nm -D --defined-only "$so" | awk '{print $3}' |
              grep -vE '^(QMM_.*|Interposer.*|interposer_comms_.*)$' || true)
            if [ -n "$unexpected" ]; then echo "$so exports:"; echo "$unexpected"; status=1; fi
          done
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: out/${{ matrix.preset }}/bin/Release/lancommander_qmm_*.so

  # QMM2 for Linux, from the pinned submodule (LANCommander/qmm2's lancommander
  # branch: upstream main with our fixes merged until they are upstream), in the
  # same Debian 12 image: QMM2's own release needs glibc 2.38 (__isoc23_strtol,
  # GLIBCXX_3.4.32).
  qmm2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build image
        run: docker build -f external/LANCommander.Interposer/docker/build.Dockerfile -t build external/LANCommander.Interposer/docker

      - name: Build
        run: docker run --rm -v "$PWD:/src" -w /src/external/qmm2 build sh -c 'make -j"$(nproc)" release32 release64'

      # Debian 12 has glibc 2.36: nothing newer may be needed.
      - name: Check symbol versions
        run: |
          status=0
          for so in external/qmm2/bin/release/x86/qmm2.so external/qmm2/bin/release/x86_64/qmm2_x86_64.so; do
            newer=$(objdump -T "$so" | grep -oE '(GLIBC_2\.(3[7-9]|[4-9][0-9])|GLIBCXX_3\.4\.(3[1-9]))' | sort -u || true)
            if [ -n "$newer" ]; then echo "$so needs:"; echo "$newer"; status=1; fi
          done
          exit $status

      - name: Collect
        run: |
          mkdir -p qmm2
          cp external/qmm2/bin/release/x86/qmm2.so external/qmm2/bin/release/x86_64/qmm2_x86_64.so qmm2/
          cp external/qmm2/LICENSE qmm2/LICENSE.qmm2
          echo "QMM2 $(git -C external/qmm2 describe --tags --always) (LANCommander/qmm2 lancommander), built on Debian 12" > qmm2/VERSION.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qmm2-linux
          path: qmm2/

  # QMM2 for Windows, from the same pinned submodule, with the MSVC project it
  # ships (msvc/qmm2.vcxproj -> bin/Release/{x86,x64}/qmm2*.dll). Windows servers
  # get the console fix (and the vmMain-field fix the CoD module needs) this way,
  # rather than waiting for our fixes to reach an upstream QMM2 release.
  qmm2-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # qmm2.vcxproj includes ../../qmm_sdks: the recursively-checked-out
      # external/qmm_sdks submodule. Nothing else is needed to configure it.
      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        working-directory: external/qmm2
        run: |
          msbuild msvc/qmm2.vcxproj /p:Configuration=Release /p:Platform=x86 /v:minimal /nologo
          msbuild msvc/qmm2.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qmm2 | Out-Null
          Copy-Item external/qmm2/bin/Release/x86/qmm2.dll        qmm2/
          Copy-Item external/qmm2/bin/Release/x64/qmm2_x86_64.dll qmm2/
          Copy-Item external/qmm2/LICENSE qmm2/LICENSE.qmm2
          "QMM2 $(git -C external/qmm2 describe --tags --always) (LANCommander/qmm2 lancommander), MSVC Release" |
            Out-File -Encoding utf8 qmm2/VERSION.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qmm2-windows
          path: qmm2/

  # The log formats the plugin parses, against the games' released code.
  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the game sources
        run: bash tests/tools/fetch_sources.sh

      - name: Check
        run: python3 -I tests/tools/check_formats.py

  package:
    needs: [windows, linux, qmm2, qmm2-windows, formats]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release, on a v* tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: bash scripts/package.sh artifacts package

      - uses: actions/upload-artifact@v4
        with:
          name: LANCommander.QMM.MatchStatistics
          path: package/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          (cd package && zip -r "../LANCommander.QMM.MatchStatistics-${GITHUB_REF_NAME}.zip" .)
          gh release create "$GITHUB_REF_NAME" "LANCommander.QMM.MatchStatistics-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
