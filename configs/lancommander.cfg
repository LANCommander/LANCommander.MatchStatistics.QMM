// LANCommander match statistics: exec this from server.cfg (exec lancommander.cfg),
// or copy the lines you need into it. README.md documents every setting.
//
// Use "set": the cvars do not exist until the plugin registers them, after
// server.cfg has run, and a bare "lc_token ..." before then is an unknown command.

// Where reports go
set lc_server_url "http://lancommander.lan:1337"
set lc_token      "lc_pat_..."           // a token with the matches:report scope; %VARIABLE% reads one from the environment
set lc_game_id    ""                     // the game's id (GUID) in LANCommander
set lc_server_id  ""                     // this server's id, if LANCommander manages it

// What a match is
set lc_min_players 1                     // humans needed before a match opens
set lc_mode        ""                    // empty: the mode from g_gametype

// What is recorded
set lc_record_bots  1
set lc_record_chat  0
set lc_record_items 0
set lc_events_exclude ""                 // e.g. "item,chat"
